<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Погодный дашборд</title>
    <link rel="stylesheet" href="style.css?v=3.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="header-title">
                <i class="fas fa-cloud-sun"></i>
                <h1>Погодный дашборд</h1>
            </div>
            <div class="header-subtitle">
                <p>Мониторинг погоды в реальном времени</p>
                <div class="header-time" id="currentTime">--:--</div>
            </div>
        </header>

        <nav class="controls-panel">
            <!--  ПОЛЕ ДЛЯ API КЛЮЧА -->
            <div class="controls-group">
                <h3><i class="fas fa-key"></i> API ключ OpenWeather</h3>
                <div class="control-actions">
                    <input type="password" 
                           id="apiKeyInput" 
                           placeholder="Введите ваш API ключ от OpenWeather"
                           style="width: 100%; padding: 10px; margin-bottom: 10px; border: 2px solid #E2E8F0; border-radius: 6px; font-size: 14px;">
                    <div style="font-size: 12px; color: #64748B; margin-top: 5px;">
                        <i class="fas fa-info-circle"></i> 
                        Ключ нужен для работы виджетов. Получите на <a href="https://openweathermap.org/api" target="_blank" style="color: #3B82F6;">OpenWeather</a>
                    </div>
                </div>
            </div>

            <div class="controls-group">
                <h3>Добавить виджеты погоды:</h3>
                <div class="control-buttons">
                    <button id="addCurrentWeatherBtn" class="control-btn weather-btn">
                        <i class="fas fa-sun"></i> Текущая погода
                    </button>
                    <button id="addForecastBtn" class="control-btn forecast-btn">
                        <i class="fas fa-calendar-alt"></i> Прогноз на 3 дня
                    </button>
                    <button id="addAirQualityBtn" class="control-btn air-btn">
                        <i class="fas fa-wind"></i> Качество воздуха
                    </button>
                    <button id="addStatsBtn" class="control-btn stats-btn">
                        <i class="fas fa-chart-line"></i> Статистика
                    </button>
                </div>
            </div>
            
            <div class="controls-group">
                <h3><i class="fas fa-cog"></i> Управление</h3>
                <div class="control-actions">
                    <button id="resetBtn" class="control-btn reset-btn">
                        <i class="fas fa-trash-alt"></i> Очистить дашборд
                    </button>
                </div>
                <div class="dashboard-stats">
                    <div class="stat-item">
                        <span class="stat-label">Виджетов:</span>
                        <span id="widgetCount" class="stat-value">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Город:</span>
                        <span id="currentCity" class="stat-value">Москва</span>
                    </div>
                </div>
            </div>
        </nav>

        <main class="dashboard-container">
            <div id="dashboard" class="dashboard">
                <div id="emptyState" class="empty-state">
                    <i class="fas fa-cloud"></i>
                    <h2>Дашборд пуст</h2>
                    <p>Добавьте виджеты для отображения погодной информации</p>
                </div>
            </div>
        </main>

        <footer class="app-footer">
            <div class="footer-content">
                <button id="refreshAllBtn" class="refresh-btn">
                    <i class="fas fa-sync-alt"></i> Обновить
                </button>
            </div>
        </footer>
    </div>

    <script type="module" src="main.js?v=3.0"></script>
</body>
</html>
